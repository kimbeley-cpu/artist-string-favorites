plugins { id 'com.android.application' }

def runNo = (System.getenv('GITHUB_RUN_NUMBER') ?: '1') as int

android {
    namespace 'io.github.kimbeleycpu.asf'
    compileSdk 34
    defaultConfig {
        applicationId 'io.github.kimbeleycpu.asf'
        minSdk 29
        targetSdk 34
        versionCode runNo
        versionName "1.${runNo}"
    }
    signingConfigs {
        release {
            // 仅用于自己侧载安装的签名，公开在仓库里；正式分发的应用应改用 GitHub Secrets
            storeFile file('../release.keystore')
            storePassword 'asf-sideload'
            keyAlias 'asf'
            keyPassword 'asf-sideload'
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    lint { abortOnError false; checkReleaseBuilds false }
}
